<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    background-color: #f2ece3;
    font-family: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: stretch;
  }

  .container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: row;
    position: relative;
  }

  /* Left content */
  .left {
    flex: 0 0 580px;
    padding: 70px 55px 60px 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 2;
  }

  .badge {
    display: inline-block;
    background: #1a1a1a;
    color: #f2ece3;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 7px 16px;
    align-self: flex-start;
    margin-bottom: 28px;
  }

  .headline {
    font-size: 80px;
    font-weight: 900;
    line-height: 1.0;
    color: #1a1a1a;
    text-transform: uppercase;
    letter-spacing: -1px;
    margin-bottom: 8px;
  }

  .headline .accent {
    color: #c8a96e;
  }

  .subline {
    font-size: 26px;
    font-weight: 400;
    color: #1a1a1a;
    letter-spacing: 0.5px;
    margin-bottom: 38px;
    line-height: 1.3;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: #c8a96e;
    margin-bottom: 32px;
  }

  .list {
    list-style: none;
    margin-bottom: 42px;
  }

  .list li {
    font-size: 19px;
    font-weight: 500;
    color: #2a2a2a;
    line-height: 1.5;
    padding-left: 22px;
    position: relative;
    margin-bottom: 8px;
  }

  .list li::before {
    content: '✓';
    position: absolute;
    left: 0;
    color: #c8a96e;
    font-weight: 700;
    font-size: 17px;
  }

  .mid-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .cta-question {
    font-size: 24px;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1.35;
    margin-bottom: 28px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .cta-button {
    display: inline-block;
    background: #1a1a1a;
    color: #f2ece3;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 18px 32px;
    align-self: flex-start;
    line-height: 1.3;
    max-width: 380px;
  }

  /* Right photo */
  .right {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .right img {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 100%;
    width: auto;
    object-fit: cover;
    object-position: top center;
  }

  /* Decorative corner element */
  .corner-mark {
    position: absolute;
    top: 50px;
    right: 40px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #1a1a1a;
    writing-mode: vertical-rl;
    text-transform: uppercase;
    opacity: 0.4;
  }
</style>
</head>
<body>
<div class="container">
  <div class="left">
    <div>
      <div class="badge">Результат учня</div>
      <div class="headline">З 0 ДО<br><span class="accent">10.000€</span></div>
      <div class="subline">за 2 місяці<br>на індивідуальному наставництві</div>
      <div class="divider"></div>
      <ul class="list">
        <li>Будували воронку продажів</li>
        <li>Запакували Instagram</li>
        <li>Побудували воронку продажів</li>
        <li>Навчилися продавати</li>
      </ul>
    </div>
    <div class="mid-section">
      <div class="cta-question">Хочеш так само?<br>Хочеш такі результати?</div>
      <div class="cta-button">Запрошую на<br>безкоштовну<br>діагностику блогу</div>
    </div>
  </div>

  <div class="right">
    <img src="ilona_promo.png" alt="Ilona" />
  </div>

  <div class="corner-mark">Наставництво</div>
</div>
</body>
</html>
